  chain_name: KiteAI Testnet
  chain_id: 2368
  rpc: https://rpc-testnet.gokite.ai/
  explorer: https://testnet.kitescan.ai/
  native_token: KITE
  chainlist: https://chainlist.org/chain/2368
- name: mainnet
  chain_name: KiteAI Mainnet
  chain_id: 2366
