testing_walkthrough:
- Set up a Passport account.
- Fund the account with testnet tokens using the faucet.
- Create an agent and approve a spending session.
- Point the agent at the service endpoint.
- Verify the service returns the correct 402 response.
- Confirm payment is processed and the service delivers the response.
