summary: >-
  Kite separates test from production at the chain level rather than with key prefixes: a distinct
  testnet L1 (chain ID 2368) with its own RPC endpoint, faucet, block explorer, and token contracts,
  mirroring mainnet (chain ID 2366). All values below are published verbatim in the Kite docs.
