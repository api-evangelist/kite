generated: '2026-07-19'
method: searched
source: https://docs.gokite.ai/kite-agent-passport/cli-reference
docs: https://docs.gokite.ai/kite-agent-passport/cli-reference
summary: >-
  Kite Agent Passport ships two first-party CLIs. kpass handles authentication, wallet management,
  agent registration, spending sessions, and execution of paid (x402) requests. ksearch is the service
  discovery CLI for searching and inspecting paid services in the Kite catalog. Both are designed to be
  driven by a coding agent, with --output json and --no-interactive for automation.
install:
- method: script
  command: curl -fsSL https://agentpassport.ai/install.sh | bash
  note: Installs the Kite Passport tools and adds the Passport skills to the local coding agent.
  source: https://docs.gokite.ai/kite-agent-passport
- method: script
  command: curl -fsSL https://cli.gokite.ai/install.sh | bash
  note: Alternate installer host referenced in the docs corpus.
  source: https://docs.gokite.ai/llms-full.txt
clis:
- name: kpass
  description: Passport CLI for authentication, wallet management, agent registration, spending sessions,
    and paid request execution.
  global_flags:
  - flag: --output json
    description: Machine-readable JSON output (recommended when agents drive the CLI).
  - flag: --no-interactive
    description: Never prompt for stdin input (required for automation).
  - flag: --base-url <URL>
    description: Override the default backend URL.
  - flag: --version
    description: Print the installed version.
  command_groups:
  - group: status
    commands:
    - command: kpass status
      description: Overall status of backend, auth, agent, and session.
    - command: kpass health --output json
      description: Backend connectivity check.
  - group: authentication
    commands:
    - command: kpass signup init --email <EMAIL> --output json
      description: Start signup; sends an email verification link.
    - command: kpass signup poll --signup-id <SIGNUP_ID> --wait --output json
      description: Poll for email verification completion.
    - command: kpass signup exchange --signup-id <SIGNUP_ID> --exchange-token <TOKEN> --output json
      description: Exchange the verified signup for credentials.
    - command: kpass login init --email <EMAIL> --output json
      description: Start login; sends an 8-character one-time code by email.
    - command: kpass login verify --login-id <LOGIN_ID> --code <OTP_CODE> --output json
      description: Complete login with the emailed one-time code.
    - command: kpass me --output json
      description: Confirm the authenticated identity.
  - group: wallet
    commands:
    - command: kpass wallet balance --output json
      description: Show wallet address and balances.
    - command: kpass wallet send --to <ADDRESS> --amount <N> --asset USDC --output json
      description: Direct wallet transfer to another address.
    - command: kpass faucet drop --recipient <WALLET_ADDRESS> --token USDC --output json
      description: Request testnet funds from the faucet.
  - group: agents
    commands:
    - command: kpass agent:register --type <TYPE> --output json
      description: Register a new agent. Common types include coding-assistant and research-agent.
    - command: kpass user agents --output json
      description: List agents owned by the logged-in user.
  - group: sessions
    commands:
    - command: kpass agent:session create --task-summary <TEXT> --max-amount-per-tx <N> --max-total-amount
        <N> --ttl <DURATION> --assets USDC --payment-approach x402_http --output json
      description: Create a spending session bounded by per-transaction cap, total cap, TTL, assets, and
        payment protocol.
    - command: kpass agent:session status --request-id <REQUEST_ID> --wait --output json
      description: Wait for user approval of a session request.
    - command: kpass agent:session list --status active --output json
      description: List active sessions for the current agent.
    - command: kpass agent:session use --session-id <SESSION_ID> --output json
      description: Switch the active session.
    - command: kpass user sessions --status active --output json
      description: List sessions across all of the user's agents.
    - command: kpass agent:session execute --url <URL> --method <METHOD> --headers <JSON> --body <JSON>
        --output json
      description: Execute a paid HTTP request against an x402 service using the approved session.
  - group: feedback
    commands:
    - command: kpass feedback submit
      description: Submit agent feedback programmatically. Added in CLI v1.3.20.
      source: https://docs.gokite.ai/changelog/2026/2026-05-27-cli-1-3-20
- name: ksearch
  description: Service discovery CLI for searching and inspecting paid services in the Kite catalog.
  command_groups:
  - group: discovery
    commands:
    - command: ksearch services list --query <TEXT> --payment-approach x402_http --asset USDC --limit <N>
        --output json
      description: Search the paid service catalog by topic, payment protocol, and asset.
    - command: ksearch services get --service-id <SERVICE_ID> --output json
      description: Inspect a single catalog service.
    - command: ksearch export markdown --output-dir ./.kite/catalog
      description: Export the catalog to local markdown.
    - command: ksearch health --output json
      description: Catalog backend connectivity check.
key_flows:
- name: Agent pays for a service end to end
  steps:
  - kpass signup init / login init then verify
  - kpass agent:register
  - kpass agent:session create with spend caps and TTL
  - kpass agent:session status --wait for user approval
  - ksearch services list to discover a paid service
  - kpass agent:session execute against the service URL
notes:
- kpass stores project-local state in .kite-passport/; run setup inside the workspace where the agent
  operates.
- Use --output json together with --no-interactive when an agent drives the workflow.
- Direct wallet transfers use kpass wallet send; agentic service payments use agent:session create plus
  agent:session execute.
related:
- packages/kite-packages.yml
- skills/_index.yml
- sandbox/kite-sandbox.yml
