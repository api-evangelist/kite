- aid: kite:kite-chain-mainnet
  name: Kite Chain JSON-RPC (Mainnet)
  description: EVM-compatible JSON-RPC interface for Kite Chain mainnet (chain ID 2366, native token KITE),
    available over HTTPS and WSS from a global endpoint plus Virginia, Tokyo, and Ireland regional endpoints.
  humanURL: https://docs.gokite.ai/kite-chain/1-getting-started/network-information
