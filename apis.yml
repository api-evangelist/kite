aid: kite
name: Kite
description: Kite (gokite.ai, formerly Zettablock) builds agentic payment infrastructure for the machine-to-machine
  economy. Kite Agent Passport gives autonomous AI agents their own identity, a funded wallet, user-set
  spending rules, delegated payment authority, and verifiable on-chain receipts, driven from a coding
  agent through the kpass and ksearch CLIs and a set of published Passport agent skills. Kite also operates
  Kite Chain, an EVM-compatible Avalanche-subnet Layer 1 (mainnet chain ID 2366, testnet 2368) with
  public HTTPS and WSS JSON-RPC endpoints, a stablecoin gasless transfer relayer built on EIP-3009 signed
  authorizations, and an x402 HTTP-402 payment surface with support for the Stripe/Tempo Machine Payments
  Protocol (MPP). Kite raised an $18M Series A led by PayPal Ventures and General Catalyst in September 2025.
